# XcodeGen spec for the iOS app. CI runs `xcodegen generate` to produce
# iosApp.xcodeproj, so no hand-maintained .pbxproj lives in the repo.
name: iosApp
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # ONNX Runtime for the Automix models (Beat This!, open-unmix vocals).
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.20.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # The Automix C++ analyzer, shared with the Android app (its JNI glue is
      # replaced by iosApp/Analysis/BitChordAnalysis.cpp).
      - path: ../../native/analyzer
        group: native
      # The two Automix models, bundled as resources.
      - path: ../../app/src/main/assets/beat_this_int8.onnx
        buildPhase: resources
      - path: ../../app/src/main/assets/vocals_umxhq_int8.onnx
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        # Point at the checked-in plist directly. XcodeGen's `info:` key would
        # regenerate (overwrite) it and drop the Compose / launch-screen keys.
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_NAME: BitChord
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasoftimezz.bitchord
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        SWIFT_OBJC_BRIDGING_HEADER: iosApp/iosApp-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../native"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
