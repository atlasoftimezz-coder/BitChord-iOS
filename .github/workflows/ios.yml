name: iOS build

# Builds an unsigned BitChord.ipa on a macOS runner and keeps it as a workflow
# artifact. Sideloadly / AltStore sign it with the installer's own Apple ID, so
# no certificates live in the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          chmod +x gradlew
          cd iosApp && xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/BitChord.app build/ipa/Payload/
          cd build/ipa && zip -qry ../BitChord.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-ipa
          path: build/BitChord.ipa
          retention-days: 30
